<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 제스처 Arduino Nano V9 Hybrid</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1160px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0}
.sub{color:#667085;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-top:18px}
.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:17px;box-shadow:0 8px 24px rgba(18,38,63,.05)}
.stage{position:relative;aspect-ratio:4/3;background:#111;border-radius:14px;overflow:hidden}
.input_video{display:none}
.output_canvas{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.overlay{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.72);color:#fff;padding:9px 12px;border-radius:10px;font-weight:900}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{padding:12px 14px;border:0;border-radius:10px;font-weight:800;background:#172033;color:#fff;cursor:pointer}
.secondary{background:#eef2f7;color:#172033}
.status{white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:10px;margin-top:10px;line-height:1.55}
.big{font-size:32px;font-weight:950;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px;background:#f7f9fc;margin:7px 0;border-radius:9px}
.pill{display:inline-block;padding:6px 9px;background:#eef2f7;border-radius:999px;margin:4px 4px 4px 0;font-weight:800}
.ok{background:#e5f5ea}
.progressWrap{height:12px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-top:10px}
.progress{height:100%;width:0%;background:#172033;transition:width .06s linear}
.commandBox{margin-top:14px;border:2px solid #172033;border-radius:14px;padding:14px;text-align:center}
.commandLabel{font-size:13px;color:#667085}
.commandValue{font-size:30px;font-weight:950;margin-top:4px}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.setting{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
input[type="range"]{width:220px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>AI 제스처 → Arduino Nano V9</h1>
      <p class="sub">V7의 안정적인 Arduino 제어 + 개선된 엄지·주먹 관절각 판정을 결합했습니다.</p>
    </div>
    <div>
      <span id="engine" class="pill">손 인식 대기</span>
      <span id="serialState" class="pill">Arduino 미연결</span>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <div class="stage">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas" width="640" height="480"></canvas>
        <div id="overlay" class="overlay">① 카메라 + 손 인식 시작</div>
      </div>

      <div class="buttons">
        <button id="startBtn">① 카메라 + 손 인식 시작</button>
        <button id="serialBtn">② Arduino 연결</button>
        <button id="stopBtn" class="secondary">정지</button>
      </div>

      <div>
        <span id="handCount" class="pill">손 0</span>
        <span id="frameCount" class="pill">프레임 0</span>
        <span id="holdState" class="pill">유지 0.0초</span>
      </div>

      <div class="setting">
        <b>명령 유지시간</b>
        <input id="holdRange" type="range" min="300" max="1500" step="100" value="700">
        <span id="holdValue">0.7초</span>
      </div>

      <div class="progressWrap"><div id="progress" class="progress"></div></div>
      <div id="status" class="status">시작 버튼을 눌러주세요.</div>
    </section>

    <aside class="card">
      <div>현재 동작</div>
      <div id="gesture" class="big">-</div>
      <div id="detail">손을 보여주세요.</div>

      <div class="commandBox">
        <div class="commandLabel">최근 실행 명령</div>
        <div id="commandValue" class="commandValue">대기</div>
      </div>

      <h3>자동 제어</h3>
      <div class="row"><span>🖐️ 손바닥</span><b>LED ON</b></div>
      <div class="row"><span>✊ 주먹</span><b>LED OFF</b></div>
      <div class="row"><span>✌️ V</span><b>Servo 90°</b></div>
      <div class="row"><span>👍 엄지 위</span><b>Servo 180°</b></div>
      <div class="row"><span>👎 엄지 아래</span><b>Servo 0°</b></div>

      <h3>수동 테스트</h3>
      <div class="manual">
        <button class="secondary" data-cmd="LED_ON">LED ON</button>
        <button class="secondary" data-cmd="LED_OFF">LED OFF</button>
        <button class="secondary" data-cmd="SERVO:0">Servo 0°</button>
        <button class="secondary" data-cmd="SERVO:90">Servo 90°</button>
        <button class="secondary" data-cmd="SERVO:180">Servo 180°</button>
      </div>
    </aside>
  </div>
</div>

<script>
const videoElement=document.querySelector('.input_video');
const canvasElement=document.querySelector('.output_canvas');
const canvasCtx=canvasElement.getContext('2d');

const statusEl=document.querySelector('#status');
const gestureEl=document.querySelector('#gesture');
const detailEl=document.querySelector('#detail');
const engineEl=document.querySelector('#engine');
const serialStateEl=document.querySelector('#serialState');
const handCountEl=document.querySelector('#handCount');
const frameCountEl=document.querySelector('#frameCount');
const holdStateEl=document.querySelector('#holdState');
const overlayEl=document.querySelector('#overlay');
const progressEl=document.querySelector('#progress');
const commandValueEl=document.querySelector('#commandValue');
const holdRange=document.querySelector('#holdRange');
const holdValue=document.querySelector('#holdValue');

let camera=null, hands=null, frames=0, active=false;
let port=null, writer=null;

let candidateName="";
let candidateCmd=null;
let candidateStarted=0;
let lastExecutedName="";
let lastExecutedAt=0;

let holdMs=700;
holdRange.oninput=()=>{
  holdMs=Number(holdRange.value);
  holdValue.textContent=(holdMs/1000).toFixed(1)+"초";
};

function dist3(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0));
}

function jointAngle(a,b,c){
  const v1={x:a.x-b.x,y:a.y-b.y,z:(a.z||0)-(b.z||0)};
  const v2={x:c.x-b.x,y:c.y-b.y,z:(c.z||0)-(b.z||0)};
  const dot=v1.x*v2.x+v1.y*v2.y+v1.z*v2.z;
  const m1=Math.hypot(v1.x,v1.y,v1.z);
  const m2=Math.hypot(v2.x,v2.y,v2.z);
  if(!m1 || !m2) return 0;
  return Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2))))*180/Math.PI;
}

function fingerExtendedAngle(lm,mcp,pip,dip,tip){
  const a1=jointAngle(lm[mcp],lm[pip],lm[dip]);
  const a2=jointAngle(lm[pip],lm[dip],lm[tip]);
  const wristTip=dist3(lm[0],lm[tip]);
  const wristPip=dist3(lm[0],lm[pip]);

  // V8보다 약간 완화해 손바닥 인식률 유지
  return a1>138 && a2>138 && wristTip>wristPip*1.08;
}

function classify(lm){
  const index=fingerExtendedAngle(lm,5,6,7,8);
  const middle=fingerExtendedAngle(lm,9,10,11,12);
  const ring=fingerExtendedAngle(lm,13,14,15,16);
  const pinky=fingerExtendedAngle(lm,17,18,19,20);

  const palm=dist3(lm[0],lm[9]);
  const thumbA1=jointAngle(lm[1],lm[2],lm[3]);
  const thumbA2=jointAngle(lm[2],lm[3],lm[4]);
  const thumbExtended=
    thumbA1>132 &&
    thumbA2>132 &&
    dist3(lm[4],lm[2])>palm*0.36;

  const thumbDY=lm[4].y-lm[2].y;
  const thumbVertical=Math.abs(thumbDY)>palm*0.20;
  const thumbUp=thumbExtended && thumbVertical && thumbDY<0;
  const thumbDown=thumbExtended && thumbVertical && thumbDY>0;

  const extendedCount=[index,middle,ring,pinky].filter(Boolean).length;
  const foldedCount=4-extendedCount;

  let name="기타 동작",cmd=null;

  // 엄지 제스처를 주먹보다 먼저 판정
  if(foldedCount===4 && thumbUp){
    name="👍 엄지 위";
    cmd="SERVO:180";
  }
  else if(foldedCount===4 && thumbDown){
    name="👎 엄지 아래";
    cmd="SERVO:0";
  }
  else if(index && middle && !ring && !pinky){
    name="✌️ V";
    cmd="SERVO:90";
  }
  // 손바닥은 V7의 높은 인식성을 살리기 위해 검지·중지 + 총 3개 이상 펴짐
  else if(index && middle && extendedCount>=3){
    name="🖐️ 손바닥";
    cmd="LED_ON";
  }
  else if(foldedCount===4 && !thumbUp && !thumbDown){
    name="✊ 주먹";
    cmd="LED_OFF";
  }

  return {
    name,
    cmd,
    detail:
      `검지 ${index?"펴짐":"접힘"} · `+
      `중지 ${middle?"펴짐":"접힘"} · `+
      `약지 ${ring?"펴짐":"접힘"} · `+
      `소지 ${pinky?"펴짐":"접힘"}`
  };
}
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ac.createOscillator();
    const gain=ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.frequency.value=880;
    gain.gain.setValueAtTime(0.12,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.16);
    osc.start();
    osc.stop(ac.currentTime+0.16);
  }catch(e){}
}

function resetHold(){
  candidateName="";
  candidateCmd=null;
  candidateStarted=0;
  progressEl.style.width="0%";
  holdStateEl.textContent="유지 0.0초";
}

async function processGesture(g){
  const now=performance.now();

  if(!g.cmd){
    resetHold();
    return;
  }

  if(g.name!==candidateName){
    candidateName=g.name;
    candidateCmd=g.cmd;
    candidateStarted=now;
  }

  const elapsed=now-candidateStarted;
  const pct=Math.min(100,(elapsed/holdMs)*100);
  progressEl.style.width=pct+"%";
  holdStateEl.textContent=`유지 ${(elapsed/1000).toFixed(1)}초`;

  if(elapsed>=holdMs){
    // 같은 제스처를 계속 들고 있을 때 반복 실행되지 않도록 1.5초 잠금
    if(g.name!==lastExecutedName || now-lastExecutedAt>1500){
      await executeCommand(g.cmd,g.name);
      lastExecutedName=g.name;
      lastExecutedAt=now;
    }
    candidateStarted=now; // 진행바를 다시 시작
  }
}

async function executeCommand(cmd,gestureName="수동"){
  commandValueEl.textContent=cmd.replace("SERVO:","Servo ");
  overlayEl.textContent=`실행: ${gestureName} → ${cmd}`;
  beep();

  if(writer){
    try{
      await writer.write(new TextEncoder().encode(cmd+"\n"));
      statusEl.textContent=`Arduino 명령 실행: ${cmd}`;
    }catch(e){
      statusEl.textContent="전송 오류: "+e.message;
    }
  }else{
    statusEl.textContent=`제스처 명령 확인: ${cmd}\nArduino는 아직 연결되지 않았습니다.`;
  }
}

function onResults(results){
  frames++;
  frameCountEl.textContent="프레임 "+frames;

  canvasCtx.save();
  canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height);
  canvasCtx.drawImage(results.image,0,0,canvasElement.width,canvasElement.height);

  const list=results.multiHandLandmarks||[];
  handCountEl.textContent="손 "+list.length;

  if(list.length){
    handCountEl.classList.add("ok");

    for(const landmarks of list){
      drawConnectors(canvasCtx,landmarks,HAND_CONNECTIONS,{color:'#00FF66',lineWidth:4});
      drawLandmarks(canvasCtx,landmarks,{color:'#FF3040',lineWidth:2,radius:4});
    }

    const g=classify(list[0]);
    gestureEl.textContent=g.name;
    detailEl.textContent=g.detail;
    overlayEl.textContent=g.name;
    processGesture(g);
  }else{
    handCountEl.classList.remove("ok");
    gestureEl.textContent="손 미검출";
    detailEl.textContent="손 전체가 화면 안에 들어오도록 보여주세요.";
    overlayEl.textContent="손을 보여주세요";
    resetHold();
  }

  canvasCtx.restore();
}

document.querySelector('#startBtn').onclick=async()=>{
  if(active)return;

  try{
    statusEl.textContent="MediaPipe Hands 엔진 로딩 중...";

    hands=new Hands({
      locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands:1,
      modelComplexity:1,
      minDetectionConfidence:0.35,
      minTrackingConfidence:0.35
    });

    hands.onResults(onResults);

    camera=new Camera(videoElement,{
      onFrame:async()=>{await hands.send({image:videoElement});},
      width:640,
      height:480
    });

    await camera.start();
    active=true;
    engineEl.textContent="손 인식 실행";
    engineEl.classList.add("ok");
    statusEl.textContent="손 인식 실행 중입니다. 같은 동작을 0.7초 정도 유지하면 명령이 실행됩니다.";
    overlayEl.textContent="손을 보여주세요";
  }catch(e){
    console.error(e);
    statusEl.textContent="시작 오류\n"+(e.name||"Error")+": "+(e.message||e);
  }
};

document.querySelector('#stopBtn').onclick=()=>{
  try{if(camera)camera.stop();}catch(e){}
  active=false;
  resetHold();
  engineEl.textContent="정지";
  engineEl.classList.remove("ok");
  statusEl.textContent="카메라/손 인식을 정지했습니다.";
  overlayEl.textContent="정지";
};

document.querySelector('#serialBtn').onclick=async()=>{
  try{
    if(!('serial' in navigator)){
      throw new Error("PC용 Chrome/Edge의 Web Serial이 필요합니다.");
    }

    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer=port.writable.getWriter();

    serialStateEl.textContent="Arduino 연결됨";
    serialStateEl.classList.add("ok");
    statusEl.textContent="Arduino Nano 연결 성공.";
  }catch(e){
    statusEl.textContent="Arduino 연결 오류\n"+(e.name||"Error")+": "+(e.message||e);
  }
};

document.querySelectorAll('[data-cmd]').forEach(b=>{
  b.onclick=()=>executeCommand(b.dataset.cmd,"수동 테스트");
});
</script>
</body>
</html>
